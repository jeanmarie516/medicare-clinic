version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medicare-postgres
    environment:
      POSTGRES_DB: medicare_db
      POSTGRES_USER: medicare_user
      POSTGRES_PASSWORD: medicare_pass123
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - medicare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicare_user -d medicare_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medicare-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/medicare_db
      DB_USERNAME: medicare_user
      DB_PASSWORD: medicare_pass123
      JWT_SECRET: medicareSecretKey2024VeryLongAndSecureKeyForJWTTokenGeneration
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medicare-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medicare-frontend
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
      VITE_WS_URL: http://localhost:8080/ws
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - medicare-network

networks:
  medicare-network:
    driver: bridge

volumes:
  postgres_data:
